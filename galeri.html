<body>
<header id="site-header"></header>
<main id="konten">
<section class="page-head"><div class="container"><h1>Galeri Foto &amp; Video</h1><p class="mt-3 text-gray-300 max-w-2xl">Momen latihan, pertandingan, dan kebersamaan.</p></div></section>
<section class="section"><div class="container"><h2 class="title">Foto</h2><div class="bar"></div><div id="foto-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div></div></section>
<section class="section bg-gray"><div class="container"><h2 class="title">Video</h2><div class="bar"></div><div id="video-grid" class="grid gap-5 md:grid-cols-2"></div></div></section>
<div id="lightbox" class="lb" role="dialog" aria-modal="true" aria-label="Penampil foto"><button data-close class="top-4 right-4" aria-label="Tutup"><i data-lucide="x"></i></button>
<button data-prev class="left-3 top-1/2" aria-label="Foto sebelumnya"><i data-lucide="chevron-left"></i></button><button data-next class="right-3 top-1/2" aria-label="Foto berikutnya"><i data-lucide="chevron-right"></i></button>
<figure class="text-center text-white"><div id="lb-body" class="flex justify-center"></div><figcaption id="lb-cap" class="mt-3"></figcaption></figure></div>
</main>
<div id="site-footer"></div>
