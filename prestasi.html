<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prestasi – Putra Asgar FC</title>
<meta name="description" content="Prestasi Putra Asgar FC: juara Piala Soeratin U15 Garut 2026, runner-up Priangan Timur, pemain terpilih Persigar dan EPA Persik Kediri.">
<meta property="og:title" content="Prestasi – Putra Asgar FC">
<meta property="og:description" content="Prestasi Putra Asgar FC: juara Piala Soeratin U15 Garut 2026, runner-up Priangan Timur, pemain terpilih Persigar dan EPA Persik Kediri.">
<meta property="og:type" content="website">
<meta property="og:locale" content="id_ID">
<meta name="theme-color" content="#B91C1C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23B91C1C'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Impact' fill='%23D4AF37' text-anchor='middle'%3EPA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<main id="konten">
<section class="page-head"><div class="container"><h1>Prestasi</h1><p class="mt-3 text-gray-300 max-w-2xl">Hasil kerja keras Laskar Domba Sakti.</p></div></section>
<section class="section"><div class="container"><h2 class="title">Etalase Trofi</h2><div class="bar"></div><div id="trofi" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div></div></section>
<section class="section bg-gray"><div class="container"><h2 class="title">Lini Masa</h2><div class="bar"></div><ol id="timeline" class="timeline max-w-3xl"></ol></div></section>

</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="assets/js/main.js"></script>
<script>(async()=>{const {getJSON,esc}=window.PAFC;try{const d=(await getJSON('data/prestasi.json')).prestasi;
const ic={Juara:'trophy','Runner-up':'medal',Seleksi:'users'};
document.getElementById('trofi').innerHTML=d.map(p=>`<div class="card p-6 text-center border-t-4 !border-t-[#D4AF37]"><i data-lucide="${ic[p.kategori]||'award'}" class="mx-auto w-12 h-12 text-[#D4AF37]"></i><span class="tag mt-3">${esc(p.kategori)}</span><h3 class="text-xl mt-2">${esc(p.judul)}</h3><p class="text-sm text-gray-600 mt-1">${p.tahun}</p></div>`).join('');
document.getElementById('timeline').innerHTML=d.map(p=>`<li><p class="font-bold text-[#B91C1C]">${p.tahun}</p><h3 class="text-xl">${esc(p.judul)}</h3><p class="text-gray-600">${esc(p.keterangan)}</p></li>`).join('');
lucide.createIcons()}catch(e){document.getElementById('trofi').innerHTML='<p class="notice">Data gagal dimuat. Jalankan situs melalui server (lihat README).</p>'}})()</script>
</body>
</html>
